<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clubo — Istar Listings</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(74,222,128,.7)}50%{box-shadow:0 0 12px rgba(74,222,128,.3)}}

/* Header — flex-shrink:0 so it takes its natural height */
.listings-header{
  flex-shrink:0;
  background:#08080F;
  padding-top:env(safe-area-inset-top);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.header-inner{padding:10px 22px 0;}
.header-top{display:flex;align-items:center;height:44px;}
.back-row{display:flex;align-items:center;gap:6px;opacity:.4;cursor:pointer;}
.back-row span{font-size:13px;font-weight:300;color:#fff;}
.event-venue{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.28);margin-bottom:2px;}
.event-name{font-family:"Fraunces",serif;font-size:26px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.05;margin-bottom:3px;}
.event-time{font-size:11px;font-weight:300;color:rgba(255,255,255,.32);margin-bottom:10px;}
.countdown-strip{display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.07);border-radius:10px;padding:8px 13px;margin-bottom:10px;}
.cd-lbl{font-size:10px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;color:rgba(255,255,255,.22);}
.cd-val{font-family:"Fraunces",serif;font-size:16px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;}
.cd-val em{font-style:normal;font-family:"DM Sans",sans-serif;font-size:10px;font-weight:300;color:rgba(255,255,255,.3);}
.filter-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:0;padding-bottom:10px;}
.filter-count{font-size:11px;color:rgba(255,255,255,.3);}
.filter-count strong{color:rgba(255,255,255,.65);font-weight:500;}
.sort-btn{display:flex;align-items:center;gap:4px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.09);border-radius:7px;padding:5px 9px;}
.sort-btn span{font-size:10px;font-weight:500;color:rgba(255,255,255,.5);letter-spacing:.04em;}

/* Scrollable list — fills remaining space between header and nav */
.tickets-scroll{
  flex:1;
  overflow-y:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;
  display:flex;flex-direction:column;gap:9px;
  padding:12px 22px calc(86px + env(safe-area-inset-bottom));
  opacity:0;transition:opacity .2s ease;
}
.tickets-scroll.ready{opacity:1;}
.tickets-scroll::-webkit-scrollbar{display:none;}

/* Cards */
.ticket-card{background:#0F0F1A;border:1px solid rgba(255,255,255,.08);border-radius:15px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;position:relative;flex-shrink:0;}
.ticket-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.07),transparent);}
.ticket-card.featured{border-color:rgba(255,255,255,.15);background:#131320;}
.cheapest-tag{position:absolute;top:-1px;right:11px;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);background:rgba(255,255,255,.07);padding:2px 7px;border-radius:0 0 6px 6px;}
.seller-avatar{width:36px;height:36px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-family:"Fraunces",serif;font-size:13px;font-weight:700;border:1.5px solid rgba(255,255,255,.1);}
.ticket-price{font-family:"Fraunces",serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1;flex-shrink:0;width:48px;}
.ticket-price sup{font-family:"DM Sans",sans-serif;font-size:11px;font-weight:400;vertical-align:super;line-height:0;color:rgba(255,255,255,.5);}
.ticket-seller{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.trust-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(74,222,128,.12);border:1px solid rgba(74,222,128,.25);border-radius:6px;padding:2px 7px 2px 5px;width:fit-content;}
.trust-dot{width:5px;height:5px;border-radius:50%;background:#4ADE80;animation:pulse 2s ease-in-out infinite;}
.trust-text{font-size:9px;font-weight:500;color:#4ADE80;letter-spacing:.06em;text-transform:uppercase;}
.seller-name{font-size:12px;font-weight:400;color:rgba(255,255,255,.6);}
.seller-trades{font-size:10px;font-weight:300;color:rgba(255,255,255,.22);}
.view-btn{height:34px;padding:0 12px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);border-radius:9px;font-size:11px;font-weight:500;color:rgba(255,255,255,.65);flex-shrink:0;white-space:nowrap;display:flex;align-items:center;justify-content:center;}

/* Buy Requests */
.section-divider{display:flex;align-items:center;gap:10px;margin:18px 0 12px;flex-shrink:0;}
.section-divider-line{flex:1;height:1px;background:rgba(255,255,255,.07);}
.section-divider-lbl{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.22);}
.buy-request-card{background:#0D0D1C;border:1px solid rgba(160,140,255,.14);border-radius:15px;padding:12px 12px 12px 14px;display:flex;align-items:center;gap:10px;position:relative;flex-shrink:0;}
.buy-request-card::before{content:"";position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(160,140,255,.12),transparent);}
.br-info{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0;}
.br-qty{font-size:13px;font-weight:500;color:rgba(255,255,255,.75);}
.br-hint{font-size:10px;font-weight:300;color:rgba(255,255,255,.3);}
.br-price{font-family:"Fraunces",serif;font-size:18px;font-weight:700;color:rgba(200,190,255,.9);letter-spacing:-.02em;flex-shrink:0;text-align:right;}
.br-price-sub{font-size:9px;font-weight:300;color:rgba(255,255,255,.3);text-align:right;margin-top:1px;}
.offer-btn{height:34px;padding:0 12px;background:rgba(160,140,255,.1);border:1px solid rgba(160,140,255,.25);border-radius:9px;font-size:11px;font-weight:500;color:rgba(200,190,255,.9);flex-shrink:0;white-space:nowrap;display:flex;align-items:center;justify-content:center;text-decoration:none;}
</style>
</head>
<body>
<div class="phone">

  <div class="listings-header" id="listingsHeader">
    <div class="header-inner">
      <div class="header-top">
        <a class="back-row" href="clubo-v2-04-home.html">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M10 3L5 8L10 13" stroke="rgba(255,255,255,.5)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Tonight</span>
        </a>
      </div>
      <div class="event-venue">Istar Madrid</div>
      <div class="event-name">Istar</div>
      <div class="event-time">Doors 23:30 · Tonight</div>
      <div class="countdown-strip">
        <div class="cd-lbl">Doors open in</div>
        <div class="cd-val" id="cdVal">--<em>h</em> --<em>m</em> --<em>s</em></div>
      </div>
      <div class="filter-row">
        <div class="filter-count" id="filterCount"><strong>12</strong> tickets available</div>
        <div class="sort-btn">
          <svg width="11" height="11" viewBox="0 0 11 11" fill="none"><path d="M1.5 3h8M3 5.5h5M4.5 8h2" stroke="rgba(255,255,255,.4)" stroke-width="1.1" stroke-linecap="round"/></svg>
          <span>Price: Low to High</span>
        </div>
      </div>
    </div>
  </div>

  <div class="tickets-scroll" id="ticketsScroll">
  </div>

  <div class="bottom-nav">
    <a class="nav-link" href="clubo-v2-04-home.html">
      <div class="nav-item active"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="rgba(255,255,255,.9)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="nav-lbl">Home</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-09-sell.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="4" y="4" width="12" height="12" rx="2" stroke="rgba(255,255,255,.25)" stroke-width="1.3"/><path d="M10 7v6M7 10h6" stroke="rgba(255,255,255,.25)" stroke-width="1.3" stroke-linecap="round"/></svg><div class="nav-lbl">Sell</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-15-balance.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="rgba(255,255,255,.25)" stroke-width="1.3"/><path d="M10 7v1.5M10 11.5V13M8 9.5c0-.83.67-1.5 2-1.5s2 .5 2 1.5S11 11 10 11s-2 .5-2 1.5S9 14 10 14" stroke="rgba(255,255,255,.25)" stroke-width="1.2" stroke-linecap="round"/></svg><div class="nav-lbl">Balance</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-08a-tickets-locked.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="11" rx="2" stroke="rgba(255,255,255,.25)" stroke-width="1.3"/><path d="M7 5V4a3 3 0 016 0v1" stroke="rgba(255,255,255,.25)" stroke-width="1.3" stroke-linecap="round"/></svg><div class="nav-lbl">Tickets</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-12-profile.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(255,255,255,.25)" stroke-width="1.3"/><path d="M3 17c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="rgba(255,255,255,.25)" stroke-width="1.3" stroke-linecap="round"/></svg><div class="nav-lbl">Profile</div></div>
    </a>
  </div>
</div>

<script src="auth.js"></script>
<script>window.addEventListener("DOMContentLoaded",function(){if(typeof ClubAuth!=="undefined")ClubAuth.requireAuth();});</script>
<script src="transition.js" defer></script>
<script>
// Show scroll area once DOM is ready (layout handled entirely by flexbox)
window.addEventListener('DOMContentLoaded', function(){
  var scroll = document.getElementById('ticketsScroll');
  if (scroll) scroll.classList.add('ready');
});

// Live countdown to 23:30
function getTarget(){
  var now=new Date(), t=new Date(now);
  t.setHours(23,30,0,0);
  if(now>=t) t.setDate(t.getDate()+1);
  return t;
}
function fmt(ms){
  if(ms<=0) return 'Open now';
  var s=Math.floor(ms/1000);
  var h=Math.floor(s/3600), m=Math.floor((s%3600)/60), sc=s%60;
  var p=function(n){return String(n).padStart(2,'0');};
  return p(h)+'<em>h</em> '+p(m)+'<em>m</em> '+p(sc)+'<em>s</em>';
}
function tick(){ document.getElementById('cdVal').innerHTML=fmt(getTarget()-new Date()); }
tick(); setInterval(tick,1000);
</script>


<script>
window.addEventListener('DOMContentLoaded', function(){
  var scroll = document.getElementById('ticketsScroll');
  var countEl = document.getElementById('filterCount');

  function escHtml(s) {
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function buildCard(listing, index, isSold) {
    var av = ClubAuth.avatarFor(listing.seller.id);
    var priceWhole = Math.floor(listing.price / 100);
    var featured = (!isSold && index === 0) ? ' featured' : '';
    var cheapestTag = (!isSold && index === 0) ? '<div class="cheapest-tag">Cheapest</div>' : '';

    if (isSold) {
      return [
        '<div class="ticket-card sold-card" style="opacity:.45;pointer-events:none;position:relative;">',
          '<div style="position:absolute;top:-1px;right:11px;font-size:9px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.35);background:rgba(255,255,255,.07);padding:2px 7px;border-radius:0 0 6px 6px;">Sold</div>',
          '<div class="seller-avatar" style="background:' + av.bg + ';color:' + av.color + ';filter:grayscale(1);">' + av.initials + '</div>',
          '<div class="ticket-price"><sup>€</sup>' + priceWhole + '</div>',
          '<div class="ticket-seller">',
            '<div class="seller-name" style="color:rgba(255,255,255,.35);">' + escHtml(listing.title) + '</div>',
            '<div class="seller-trades">Purchased</div>',
          '</div>',
          '<div class="view-btn" style="opacity:.4;background:rgba(255,255,255,.04);">Sold</div>',
        '</div>'
      ].join('');
    }

    return [
      '<div class="ticket-card' + featured + '" data-listing-id="' + escHtml(listing.id) + '">',
        cheapestTag,
        '<div class="seller-avatar" style="background:' + av.bg + ';color:' + av.color + ';">' + av.initials + '</div>',
        '<div class="ticket-price"><sup>€</sup>' + priceWhole + '</div>',
        '<div class="ticket-seller">',
          '<div class="trust-badge"><div class="trust-dot"></div><div class="trust-text">Clean</div></div>',
          '<div class="seller-name">' + escHtml(listing.title) + '</div>',
          '<div class="seller-trades">Listed just now</div>',
        '</div>',
        '<a class="view-btn" href="clubo-v2-06-ticket-detail.html">View Ticket</a>',
      '</div>'
    ].join('');
  }

  function renderEmpty() {
    scroll.innerHTML = '<div style="text-align:center;padding:40px 0;color:rgba(255,255,255,.25);font-size:13px;font-weight:300;">No tickets available right now.</div>';
    if(countEl) countEl.innerHTML = '<strong>0</strong> tickets available';
  }

  function renderError() {
    scroll.innerHTML = '<div style="text-align:center;padding:40px 0;color:rgba(239,68,68,.5);font-size:13px;font-weight:300;">Could not load listings. Is the server running?</div>';
  }

  Promise.all([
    ClubAuth.getListings('istar'),
    ClubAuth.getBuyOrders('istar').catch(function(){ return []; }),
    ClubAuth.fetchMe().catch(function(){ return null; }),
  ]).then(function(results) {
    var listings = results[0];
    var buyOrders = results[1] || [];
    var me = results[2];

    var active = listings.filter(function(l){ return l.status === 'active'; });
    var sold   = listings.filter(function(l){ return l.status === 'sold'; });

    var soldHtml   = sold.map(function(l, i){ return buildCard(l, i, true); }).join('');
    var activeHtml = active.map(function(l, i){ return buildCard(l, i, false); }).join('');

    if (active.length === 0 && sold.length === 0) { renderEmpty(); }
    else {
      scroll.innerHTML = soldHtml + activeHtml;
      if (sold.length > 0) {
        var firstActive = scroll.querySelector('.ticket-card:not(.sold-card)');
        if (firstActive) firstActive.scrollIntoView();
      }
      if(countEl) countEl.innerHTML = '<strong>' + active.length + '</strong> tickets available';
      scroll.querySelectorAll('.ticket-card[data-listing-id]').forEach(function(card){
        var link = card.querySelector('.view-btn');
        if (!link) return;
        link.addEventListener('click', function(){
          localStorage.setItem('clubo_viewing_listing', card.getAttribute('data-listing-id'));
        });
      });
    }

    // Buy requests section
    var openRequests = buyOrders.filter(function(r){ return r.status === 'OPEN'; });
    var divider = '<div class="section-divider"><div class="section-divider-line"></div><div class="section-divider-lbl">Buy Requests</div><div class="section-divider-line"></div></div>';
    var meId = me && me.id;
    var requestsHtml;
    if (openRequests.length === 0) {
      requestsHtml = '<div style="text-align:center;padding:18px 0 8px;color:rgba(255,255,255,.2);font-size:12px;font-weight:300;">No buy requests right now.</div>';
    } else {
      requestsHtml = openRequests.map(function(r) {
        var av = ClubAuth.avatarFor(r.buyer && r.buyer.phone ? r.buyer.phone : r.id);
        var isOwner = meId && r.buyerId === meId;
        var offerBtn = isOwner
          ? '<div style="height:34px;padding:0 12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:9px;font-size:10px;color:rgba(255,255,255,.3);display:flex;align-items:center;">Your request</div>'
          : '<a class="offer-btn" href="clubo-v2-sell-offer.html?buyOrderId=' + escHtml(r.id) + '">Make an offer</a>';
        return '<div class="buy-request-card">'
          + '<div class="seller-avatar" style="background:' + av.bg + ';color:' + av.color + ';">' + av.initials + '</div>'
          + '<div class="br-info">'
          + '<div class="br-qty">Looking for ' + r.quantity + ' ticket' + (r.quantity > 1 ? 's' : '') + '</div>'
          + '<div class="br-hint">Seller can propose a higher price</div>'
          + '</div>'
          + '<div style="text-align:right;flex-shrink:0;margin-right:8px;">'
          + '<div class="br-price">€' + Math.floor(r.pricePerTicket / 100) + '</div>'
          + '<div class="br-price-sub">/ ticket</div>'
          + '</div>'
          + offerBtn
          + '</div>';
      }).join('');
    }
    var section = document.createElement('div');
    section.innerHTML = divider + requestsHtml;
    scroll.appendChild(section);

  }).catch(function(err) {
    console.error('Listings error:', err);
    renderError();
  });
});
</script>
</body>
</html>
