<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clubo — 09 Sell Ticket</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding-top:calc(74px + env(safe-area-inset-top));padding-left:22px;padding-right:22px;padding-bottom:calc(86px + env(safe-area-inset-bottom));scrollbar-width:none;}
.title{font-family:'Fraunces',serif;font-size:28px;font-weight:700;color:#fff;margin-bottom:22px;}
.label{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:6px;}
.input-wrap{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;position:relative;}
.chev{opacity:.35;}
.price-wrap{background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:14px;padding:14px 14px;display:flex;align-items:center;gap:10px;margin-bottom:6px;}
.currency{font-size:18px;font-weight:600;color:rgba(255,255,255,.35);}
.price-input{border:none;background:transparent;outline:none;color:#fff;font-family:'Fraunces',serif;font-size:34px;font-weight:700;width:100%;}
.hint{font-size:11px;font-weight:300;color:rgba(255,255,255,.28);margin-bottom:16px;}
.tag{display:inline-flex;align-items:center;justify-content:center;height:18px;padding:0 8px;border-radius:999px;font-size:9px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;background:rgba(239,68,68,.15);border:1px solid rgba(239,68,68,.3);color:rgba(239,68,68,.8);margin-left:8px;}

/* Upload area */
.upload-area{border:1.5px dashed rgba(255,255,255,.15);border-radius:14px;padding:20px 16px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;margin-bottom:14px;cursor:pointer;transition:border-color .2s,background .2s;min-height:80px;}
.upload-area:hover,.upload-area.drag{border-color:rgba(74,222,128,.4);background:rgba(74,222,128,.04);}
.upload-area.has-file{border-style:solid;border-color:rgba(74,222,128,.35);background:rgba(74,222,128,.05);}
.upload-icon{color:rgba(255,255,255,.3);}
.upload-area.has-file .upload-icon{color:#4ADE80;}
.upload-label{font-size:13px;font-weight:400;color:rgba(255,255,255,.45);}
.upload-area.has-file .upload-label{color:#4ADE80;font-weight:500;}
.upload-sub{font-size:11px;font-weight:300;color:rgba(255,255,255,.2);}
.thumb-preview{width:100%;border-radius:10px;max-height:120px;object-fit:cover;margin-top:4px;display:none;}

.cta-area{margin-top:auto;padding-bottom:14px;}
.cta-btn{width:100%;height:52px;border-radius:14px;font-family:'DM Sans',sans-serif;font-size:14px;font-weight:500;background:#fff;color:#08080F;display:flex;align-items:center;justify-content:center;text-decoration:none;border:none;cursor:pointer;}
.cta-btn:disabled{opacity:.4;cursor:not-allowed;}
.secondary-link{margin-top:10px;display:inline-flex;align-items:center;justify-content:center;height:36px;width:100%;border-radius:12px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);font-size:11px;font-weight:500;color:rgba(255,255,255,.45);text-decoration:none;}
</style>
</head>
<body>
<div class="page-label">Clubo · 09 — Sell Ticket</div>
<div class="phone">
  <div class="top-bar"><div class="top-title">Clubo</div></div>
  <div class="screen">
    <div class="title">Sell Ticket</div>

    <div class="label">Event</div>
    <div class="input-wrap" style="padding:0;">
      <select id="eventSelect" style="width:100%;background:transparent;border:none;outline:none;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:13px;padding:14px;appearance:none;-webkit-appearance:none;">
        <option value="mondays">Mondays · Fabrik Madrid</option>
        <option value="istar">Istar · Istar Madrid</option>
        <option value="other">Other Event</option>
      </select>
      <svg class="chev" style="position:absolute;right:14px;pointer-events:none;" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 6l3 3 3-3" stroke="rgba(255,255,255,.6)" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div id="otherEventWrap" style="display:none;">
      <div class="label">Event Name</div>
      <div class="input-wrap">
        <input id="otherEventLabel" style="background:transparent;border:none;outline:none;color:rgba(255,255,255,.7);font-family:'DM Sans',sans-serif;font-size:13px;width:100%;" placeholder="e.g. Fabrik Saturday" />
      </div>
    </div>

    <div class="label">Your Price</div>
    <div class="price-wrap">
      <div class="currency">€</div>
      <input class="price-input" id="priceInput" value="14" inputmode="numeric" />
    </div>
    <div class="hint">Set any price — buyers can make offers below your list price.</div>

    <div class="label">Ticket Screenshot <span class="tag">Mandatory</span></div>
    <input type="file" id="ticketFileInput" accept="image/*" style="display:none;" />
    <div class="upload-area" id="uploadArea">
      <svg class="upload-icon" width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 15V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M7 9l4-4 4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 18h14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      <div class="upload-label" id="uploadLabel">Tap to upload screenshot</div>
      <div class="upload-sub" id="uploadSub">JPG, PNG or WEBP · Max 10MB</div>
      <img id="thumbPreview" class="thumb-preview" alt="Ticket preview" />
    </div>

    <div class="cta-area">
      <a class="secondary-link" href="clubo-v2-10-bulk.html">Bulk list (3 tickets)</a>
      <div id="sell-error" style="display:none;color:rgba(239,68,68,.85);font-size:12px;font-weight:400;text-align:center;margin-bottom:8px;margin-top:8px;"></div>
      <button id="listBtn" class="cta-btn" type="button">List Ticket</button>
    </div>
  </div>

  <div class="bottom-nav">
    <a class="nav-link" href="clubo-v2-04-home.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3l7 6.5V17a1 1 0 01-1 1H4a1 1 0 01-1-1V9.5z" stroke="rgba(255,255,255,.25)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg><div class="nav-lbl">Home</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-09-sell.html">
      <div class="nav-item active"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="4" y="4" width="12" height="12" rx="2" stroke="rgba(255,255,255,.9)" stroke-width="1.3"/><path d="M10 7v6M7 10h6" stroke="rgba(255,255,255,.9)" stroke-width="1.3" stroke-linecap="round"/></svg><div class="nav-lbl">Sell</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-15-balance.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="rgba(255,255,255,.25)" stroke-width="1.3"/><path d="M10 7v1.5M10 11.5V13M8 9.5c0-.83.67-1.5 2-1.5s2 .5 2 1.5S11 11 10 11s-2 .5-2 1.5S9 14 10 14" stroke="rgba(255,255,255,.25)" stroke-width="1.2" stroke-linecap="round"/></svg><div class="nav-lbl">Balance</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-08a-tickets-locked.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="5" width="14" height="11" rx="2" stroke="rgba(255,255,255,.25)" stroke-width="1.3"/><path d="M7 5V4a3 3 0 016 0v1" stroke="rgba(255,255,255,.25)" stroke-width="1.3" stroke-linecap="round"/></svg><div class="nav-lbl">Tickets</div></div>
    </a>
    <a class="nav-link" href="clubo-v2-12-profile.html">
      <div class="nav-item"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7.5" r="3" stroke="rgba(255,255,255,.25)" stroke-width="1.3"/><path d="M3 17c0-3.866 3.134-7 7-7s7 3.134 7 7" stroke="rgba(255,255,255,.25)" stroke-width="1.3" stroke-linecap="round"/></svg><div class="nav-lbl">Profile</div></div>
    </a>
  </div>
</div>

<script src="auth.js"></script>
<script>window.addEventListener("DOMContentLoaded",function(){if(typeof ClubAuth!=="undefined")ClubAuth.requireAuth();});</script>
<script src="transition.js" defer></script>
<script>
var selectedFile = null;

// Show/hide other event label input
document.getElementById('eventSelect').addEventListener('change', function() {
  document.getElementById('otherEventWrap').style.display = this.value === 'other' ? 'block' : 'none';
});

// Upload area click → trigger file input
var uploadArea = document.getElementById('uploadArea');
uploadArea.addEventListener('click', function() {
  document.getElementById('ticketFileInput').click();
});

// Drag and drop
uploadArea.addEventListener('dragover', function(e) { e.preventDefault(); uploadArea.classList.add('drag'); });
uploadArea.addEventListener('dragleave', function() { uploadArea.classList.remove('drag'); });
uploadArea.addEventListener('drop', function(e) {
  e.preventDefault();
  uploadArea.classList.remove('drag');
  var f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) handleFile(f);
});

document.getElementById('ticketFileInput').addEventListener('change', function(e) {
  var f = e.target.files && e.target.files[0];
  if (f) handleFile(f);
});

function handleFile(f) {
  if (!f.type.startsWith('image/')) {
    showError('Please upload an image file.');
    return;
  }
  if (f.size > 10 * 1024 * 1024) {
    showError('File too large — max 10MB.');
    return;
  }
  selectedFile = f;
  uploadArea.classList.add('has-file');
  document.getElementById('uploadLabel').textContent = f.name;
  document.getElementById('uploadSub').textContent = 'Tap to replace';
  var reader = new FileReader();
  reader.onload = function(e) {
    var thumb = document.getElementById('thumbPreview');
    thumb.src = e.target.result;
    thumb.style.display = 'block';
  };
  reader.readAsDataURL(f);
}

function showError(msg) {
  var errEl = document.getElementById('sell-error');
  errEl.textContent = msg;
  errEl.style.display = 'block';
}

document.getElementById('listBtn').addEventListener('click', async function() {
  var btn        = document.getElementById('listBtn');
  var errEl      = document.getElementById('sell-error');
  errEl.style.display = 'none';

  var eventSelect  = document.getElementById('eventSelect');
  var event        = eventSelect.value;
  var eventTitle   = eventSelect.options[eventSelect.selectedIndex].text;
  var eventLabel   = event === 'other' ? (document.getElementById('otherEventLabel').value.trim()) : null;
  var eurosRaw     = parseFloat(document.getElementById('priceInput').value);

  if (isNaN(eurosRaw) || eurosRaw <= 0) { showError('Please enter a valid price.'); return; }
  if (event === 'other' && !eventLabel)  { showError('Please enter the event name.'); return; }
  if (!selectedFile) { showError('Please upload your ticket screenshot.'); return; }

  var priceCents = Math.round(eurosRaw * 100);
  btn.disabled = true;
  btn.textContent = 'Creating listing…';

  try {
    // 1. Create listing
    var listing = await ClubAuth.createListing(event === 'other' ? eventLabel : eventTitle, priceCents, event, eventLabel, 1);

    // 2. Get S3 upload URL
    btn.textContent = 'Uploading ticket…';
    var uploadData = await ClubAuth.getTicketUploadUrl(listing.id, selectedFile.type);

    // 3. Upload file to S3
    await ClubAuth.uploadFileToS3(uploadData.uploadUrl, selectedFile);

    // 4. Attach ticket URL + trigger AI scan
    btn.textContent = 'Scanning ticket…';
    var result = await ClubAuth.attachTicketUrl(listing.id, uploadData.publicUrl);

    if (!result.ok) {
      // AI scan rejected
      var flags = (result.scan && result.scan.flags && result.scan.flags.length) ? result.scan.flags.join(', ') : 'Ticket could not be verified';
      showError('Ticket rejected: ' + flags + '. Please upload a clearer screenshot.');
      btn.disabled = false;
      btn.textContent = 'List Ticket';
      return;
    }

    if (result.scan && result.scan.result === 'FLAG') {
      // Flagged but accepted — warn and continue
      btn.textContent = 'Listed (flagged for review)';
    }

    localStorage.setItem('clubo_new_listing_id', listing.id);
    var dest = event === 'istar' ? 'clubo-v2-05-listings-istar.html' : 'clubo-v2-05-listings-mondays.html';
    window.cluboNavigate(dest);
  } catch(err) {
    showError(err.message || 'Could not create listing. Try again.');
    btn.disabled = false;
    btn.textContent = 'List Ticket';
  }
});
</script>
</body>
</html>
