<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clubo — 08B Tickets Live</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulse{0%,100%{box-shadow:0 0 6px rgba(74,222,128,.7)}50%{box-shadow:0 0 12px rgba(74,222,128,.3)}}
.screen{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;padding-top:calc(74px + env(safe-area-inset-top));padding-left:22px;padding-right:22px;padding-bottom:calc(86px + env(safe-area-inset-bottom));scrollbar-width:none;}
.top-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;}
.title{font-family:'Fraunces',serif;font-size:26px;font-weight:700;color:#fff;}
.sub{font-size:12px;font-weight:300;color:rgba(255,255,255,.35);margin-top:2px;}
.card{background:#0F0F1A;border:1px solid rgba(255,255,255,.09);border-radius:18px;padding:16px;position:relative;overflow:hidden;}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,255,255,.08),transparent);}
.event{font-size:10px;font-weight:500;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.25);margin-bottom:6px;}
.event-name{font-family:'Fraunces',serif;font-size:22px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.1;margin-bottom:6px;}
.event-meta{font-size:12px;font-weight:300;color:rgba(255,255,255,.32);display:flex;align-items:center;gap:6px;margin-bottom:14px;}
.ticket-preview{width:100%;height:170px;border-radius:14px;background:linear-gradient(135deg,#1a1a2e 0%,#16213e 50%,#0f3460 100%);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;}
.ticket-title{position:absolute;top:12px;left:14px;font-family:'Fraunces',serif;font-size:16px;font-weight:700;color:rgba(255,255,255,.75);}
.ticket-sub{position:absolute;top:33px;left:14px;font-size:10px;font-weight:300;color:rgba(255,255,255,.35);}
.ticket-venue{position:absolute;bottom:12px;left:14px;font-size:9px;font-weight:400;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.3);}
.qr-wrap{width:92px;height:92px;position:absolute;right:14px;top:50%;transform:translateY(-50%);}
.qr-inner{width:92px;height:92px;background:#fff;border-radius:8px;display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px;}
.qr-cell{background:#111;border-radius:1px;}
.qr-inner .w{background:#fff;}
.qr-unlock-text{font-size:11px;font-weight:300;color:rgba(255,255,255,.3);text-align:center;line-height:1.55;margin-top:12px;}
.qr-unlock-text strong{color:rgba(255,255,255,.55);font-weight:400;}

/* report link */
.report-issue{margin-top:12px;display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 14px;border-radius:11px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);font-size:11px;font-weight:500;color:rgba(255,255,255,.5);text-decoration:none;}


/* Nav */
</style>
</head>

<script>
(function(){
  var now=new Date();
  var d=String(now.getDate()).padStart(2,'0');
  var m=String(now.getMonth()+1).padStart(2,'0');
  document.querySelectorAll('.ticket-venue').forEach(function(el){
    el.textContent=el.textContent.replace(/\d{2}\.\d{2}/g,d+'.'+m);
  });
})();
</script>
