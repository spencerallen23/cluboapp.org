<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clubo — 01 Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.phone{align-items:center;justify-content:center;}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.glow{position:absolute;width:280px;height:200px;background:radial-gradient(ellipse,rgba(255,255,255,.05) 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-55%);pointer-events:none;}
.splash-link{display:flex;align-items:center;justify-content:center;width:100%;height:100%;position:absolute;inset:0;z-index:2;}
.content{display:flex;flex-direction:column;align-items:center;gap:12px;animation:fadeUp .7s cubic-bezier(.16,1,.3,1) both;z-index:2;}
.wordmark{font-family:'Fraunces',serif;font-size:58px;font-weight:700;color:#fff;letter-spacing:-.03em;line-height:1;}
.rule{width:28px;height:1.5px;background:rgba(255,255,255,.18);border-radius:2px;animation:fadeUp .7s .12s cubic-bezier(.16,1,.3,1) both;}
.sub{font-size:11px;font-weight:300;color:rgba(255,255,255,.35);letter-spacing:.16em;text-transform:uppercase;text-align:center;animation:fadeUp .7s .2s cubic-bezier(.16,1,.3,1) both;}
</style>
</head>
<body>
<div class="page-label">Clubo · 01 — Splash</div>
<div class="phone">
  <a class="splash-link" href="clubo-v2-02-signup.html">
    <div class="glow"></div>
    <div class="content">
      <div class="wordmark">Clubo</div>
      <div class="rule"></div>
      <div class="sub">Trusted student ticket exchange</div>
    </div>
  </a>
</div>

<script>
  // Auto-redirect logged-in users to home after splash
  if (localStorage.getItem("clubo_token")) {
    setTimeout(function() {
      window.location.replace("clubo-v2-04-home.html");
    }, 2300);
  }

  // Handle logout (legacy ?logout=1 param kept for backwards compat)
  var params = new URLSearchParams(window.location.search);
  if (params.get('logout') === '1') {
    if (typeof ClubAuth !== 'undefined') ClubAuth.clearAuth();
    else {
      localStorage.removeItem('clubo_token');
      localStorage.removeItem('clubo_phone');
      localStorage.removeItem('clubo_authed');
    }
  }
  // Auto-advance to signup after 2.3s (skip if already logged in)
  if (!localStorage.getItem("clubo_token")) {
  setTimeout(function() {
    if (window.cluboNavigate) {
      window.cluboNavigate('clubo-v2-02-signup.html');
    } else {
      window.location.href = 'clubo-v2-02-signup.html';
    }
  }, 2300);
  }
</script>
<script src="auth.js"></script>
<script src="transition.js" defer></script>
</body>
</html>
