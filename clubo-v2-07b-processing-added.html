<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clubo — 07B Processing: Ticket Added</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="common.css">
<style>
.phone{align-items:center;justify-content:center;}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.content{display:flex;flex-direction:column;align-items:center;gap:18px;padding:0 32px;text-align:center;animation:fadeUp .65s cubic-bezier(.16,1,.3,1) both;}
.check-icon{width:64px;height:64px;border-radius:50%;background:rgba(74,222,128,.1);border:1px solid rgba(74,222,128,.25);display:flex;align-items:center;justify-content:center;}
.title{font-family:'Fraunces',serif;font-size:24px;font-weight:700;color:#fff;letter-spacing:-.02em;line-height:1.2;}
.sub{font-size:13px;font-weight:300;color:rgba(255,255,255,.3);line-height:1.6;}
.tab-hint{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.09);border-radius:12px;padding:11px 15px;}
.tab-hint-text{font-size:12px;font-weight:300;color:rgba(255,255,255,.4);line-height:1.4;}
.tab-hint-text strong{color:rgba(255,255,255,.7);font-weight:500;}
.step-dots{display:flex;gap:7px;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.12);}
.dot.active{background:#fff;}
</style>
</head>
<body>
<div class="page-label">Clubo · 07B — Processing: Ticket Added</div>
<div class="phone">
  <div class="top-bar"><div class="top-title">Clubo</div></div>
  <div class="content">
    <div class="check-icon">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none">
        <path d="M6 15l6 6 12-12" stroke="#4ADE80" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="title">Ticket added to<br>your Tickets tab.</div>
    <div class="sub">QR unlocks at event start.<br>You'll receive a notification.</div>
    <a class="tab-hint" href="clubo-v2-08a-tickets-locked.html">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><rect x="2" y="4.5" width="11" height="8.5" rx="1.5" stroke="rgba(255,255,255,.45)" stroke-width="1.2"/><path d="M5.5 4.5V3.5a2 2 0 014 0v1" stroke="rgba(255,255,255,.45)" stroke-width="1.2" stroke-linecap="round"/></svg>
      <div class="tab-hint-text">Find it in your <strong>Tickets</strong> tab</div>
    </a>
    <div class="step-dots">
      <div class="dot"></div>
      <div class="dot active"></div>
    </div>
  </div>
</div>
<script src="auth.js"></script>
<script>window.addEventListener("DOMContentLoaded",function(){if(typeof ClubAuth!=="undefined")ClubAuth.requireAuth();});</script>
<script src="transition.js" defer></script>
<script>
  function goTickets(){window.cluboNavigate("clubo-v2-08a-tickets-locked.html");}
  setTimeout(goTickets,2000);
</script>
</body>
</html>
